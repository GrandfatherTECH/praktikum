server {
    listen 80;
    server_name _;

    # TLS example (uncomment and configure for HTTPS)
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example/privkey.pem;

    client_max_body_size 100M;

    root /var/www/sed/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8000/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Protected storage must never be served directly by Nginx.
    # Do not add any location exposing /storage or other protected files.
}
